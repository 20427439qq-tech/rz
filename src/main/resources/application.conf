ktor {
  deployment {
    port = 8080
    port = ${?PORT}
  }

  application {
    modules = [ com.rz.gateway.skeleton.ApplicationKt.module ]
  }
}

database {
  enabled = false
  enabled = ${?DB_ENABLED}
  driver = "org.postgresql.Driver"
  driver = ${?DB_DRIVER}
  jdbcUrl = "jdbc:postgresql://127.0.0.1:5432/rbac_business"
  jdbcUrl = ${?DB_JDBC_URL}
  username = "postgres"
  username = ${?DB_USERNAME}
  password = "postgres"
  password = ${?DB_PASSWORD}
  maximumPoolSize = 10
  maximumPoolSize = ${?DB_MAX_POOL_SIZE}
}

redis {
  enabled = false
  enabled = ${?REDIS_ENABLED}
  address = "redis://127.0.0.1:6379"
  address = ${?REDIS_ADDRESS}
  password = ${?REDIS_PASSWORD}
  database = 0
  database = ${?REDIS_DATABASE}
  keyPrefix = "rbac-business:"
  keyPrefix = ${?REDIS_KEY_PREFIX}
}

business {
  serviceName = "rbac-business-skeleton"
}
